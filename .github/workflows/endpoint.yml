name: Melde-Endpunkt

# Der Rueckkanal fuer Meldungen (ADR 0002) hat zwei Teile, die auseinanderlaufen koennen:
# das Token-Format steht in tools/report/mint_token.py (praegt) UND in
# server/melden/token.php (prueft). Laufen sie auseinander, stimmt kein einziges Token
# mehr — und zwar erst auf dem Rechner eines Kindes, nicht hier. Deshalb rechnen beide
# Seiten bei jedem Push dieselben Vektoren nach.
#
# Dazu der Pruefstand des Endpunkts: er startet den PHP-eigenen Webserver gegen ein
# Wegwerf-Docroot und spielt die Faelle durch (Token, Doppelmeldung, Rate-Limit, Rotation,
# HTTPS-Zwang, Ablage nicht abrufbar). Braucht kein Secret und kein Netz.
#
# Dazu der Pruefstand des Statistik-Endpunkts (ADR 0021): App-Schluessel statt
# Personen-Token, Snapshot je Tag, Spur in Stuecken, gzip-Grenzen, Kontingente.
#
# Dazu der Selbsttest von tools/stats/rebuild_save.py: es baut die Pruefsummen-Huelle des
# Spielstands (ADR 0024) in Python nach; weicht sie ab, laedt „Laden…“ die Datei nicht.
#
# Dazu der Selbsttest von tools/report/to_issues.py: das Skript erkennt an Markern im
# Issue-Text, welche Meldung schon eingetragen ist. Faellt das Erkennen aus, schreibt es
# jede Meldung erneut — und zwar in ein echtes Repo. Die reinen Funktionen (Marker lesen,
# Schluessel bilden, Text bauen) laufen deshalb ohne Netz und ohne `gh` mit.
#
# ubuntu-latest bringt PHP mit; tools/report/php.sh nimmt dann die vorhandene Installation
# und keinen Container.

on:
  push:
    paths:
      - "server/**"
      - "tools/report/**"
      - "tools/stats/**"
      - ".devcontainer/**"
      - ".github/workflows/endpoint.yml"
  pull_request:
    paths:
      - "server/**"
      - "tools/report/**"
      - "tools/stats/**"
      - ".devcontainer/**"
  workflow_dispatch:

jobs:
  endpunkt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fassungen nennen
        run: |
          php --version
          python3 --version

      - name: Token-Format, beide Implementierungen gegen dieselben Vektoren
        run: |
          python3 tools/report/mint_token.py --self-test
          tools/report/php.sh server/melden/verify_token.php --self-test

      - name: Endpunkt-Pruefstand
        run: tools/report/php.sh server/melden/test_endpoint.php

      - name: Statistik-Pruefstand
        run: tools/report/php.sh server/statistik/test_endpoint.php

      - name: Statistik-Auswertung
        run: python3 tools/stats/report.py --self-test

      - name: Spielstand aus Snapshots
        run: python3 tools/stats/rebuild_save.py --self-test

      - name: Buendelung zu Issues
        run: python3 tools/report/to_issues.py --self-test
