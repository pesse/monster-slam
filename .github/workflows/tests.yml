name: Tests

# gdUnit4 bei jedem Push, auf derselben Plattform wie der Release-Build (Windows).
# Ohne Submodule: datenabhängige Tests überspringen sich selbst (docs/TESTING.md).

on:
  push:
  pull_request:
  workflow_dispatch:

# Ein neuer Push auf denselben Branch bricht den alten Lauf ab.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Muss zu release.yml und zur lokalen Toolchain passen.
  GODOT_VERSION: "4.7-stable"

jobs:
  gdunit:
    # Ein PR aus diesem Repo ist schon über seinen Push getestet; nur Forks laufen über
    # pull_request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Godot aus dem Cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-win64

      - name: Godot holen
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}_win64.exe.zip"
          unzip -q godot.zip -d godot

      - name: Godot-Pfad setzen
        shell: bash
        run: echo "GODOT=$(pwd)/godot/Godot_v${GODOT_VERSION}_win64.exe" >> "$GITHUB_ENV"

      - name: Projekt importieren
        shell: bash
        run: '"$GODOT" --headless --import 2>&1 | tr -d "\r"'

      # --continue, damit ein Fehler nicht den Rest seiner Suite verdeckt; die Ausgabe
      # bleibt ungekürzt, sonst fehlt im Log, welcher Test rot war.
      - name: Tests
        shell: bash
        run: |
          "$GODOT" --headless -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode --continue -a res://tests 2>&1 | tr -d '\r'

      - name: Test-Report sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
