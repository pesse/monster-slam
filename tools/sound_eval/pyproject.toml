[project]
name = "soundeval"
version = "0.1.0"
description = "Lokale Bewertung von Spiel-Soundeffekten mit LAION-CLAP und technischer Analyse"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12.1",   # libsndfile >= 1.1 liest MP3 ohne ffmpeg
    "soxr>=0.3",           # Resampling auf 48 kHz für CLAP
    "pyloudnorm>=0.1.1",   # Lautheit nach ITU-R BS.1770 (LUFS)
    "pyyaml>=6",
    "transformers>=4.44",  # ClapModel = LAION-CLAP-Gewichte (laion/larger_clap_general)
]

[project.optional-dependencies]
cpu = ["torch>=2.7"]
cu128 = ["torch>=2.7"]
dev = ["pytest>=8"]

[project.scripts]
sound-eval = "soundeval.cli:main"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["clap: lädt das echte CLAP-Modell (langsam, braucht Download)"]
